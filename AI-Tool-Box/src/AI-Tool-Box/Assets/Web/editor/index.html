<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>HTML 编辑器</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0A0F14; color:#DCEEF7;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  #bar { position:fixed; top:0; left:0; right:0; height:42px; display:flex; align-items:center; gap:6px;
    padding:0 10px; background:#141B24; border-bottom:1px solid #1F2C38; z-index:10; overflow-x:auto; }
  #bar button, #bar select { background:#1B2733; color:#BFE9F5; border:1px solid #2A3A49; border-radius:6px;
    padding:4px 8px; font-size:12px; cursor:pointer; height:28px; }
  #bar button:hover, #bar select:hover { background:#22323F; border-color:#00C8E0; }
  #bar .sep { width:1px; height:22px; background:#26343F; margin:0 4px; flex:0 0 auto; }
  #bar .accent { border-color:#00C8E0; color:#00E5FF; }
  #wrap { position:absolute; top:42px; left:0; right:0; bottom:0; overflow:auto; padding:18px; }
  #paper { background:#FFFFFF; color:#111418; max-width:900px; margin:0 auto; min-height:100%;
    padding:40px 48px; border-radius:6px; box-shadow:0 6px 28px rgba(0,0,0,.45);
    font-size:15px; line-height:1.75; outline:none; }
  #paper:empty:before { content:"在此输入内容，或使用上方 AI 生成/补写…"; color:#9AA6B2; }
  #paper table { border-collapse:collapse; width:100%; margin:10px 0; }
  #paper td, #paper th { border:1px solid #99A3AD; padding:6px 8px; }
  #paper img { max-width:100%; }
  #paper a { color:#0A72A8; }
  #hint { position:fixed; right:14px; bottom:10px; font-size:11px; color:#5B7284; }
  @media print {
    #bar, #hint { display:none !important; }
    html, body { background:#fff; }
    #wrap { position:static; padding:0; overflow:visible; }
    #paper { box-shadow:none; max-width:none; padding:0; border-radius:0; min-height:auto; }
  }
</style>
</head>
<body>
<div id="bar">
  <select id="block" title="段落样式" onchange="applyBlock(this.value)">
    <option value="p">正文</option>
    <option value="h1">标题 1</option>
    <option value="h2">标题 2</option>
    <option value="h3">标题 3</option>
    <option value="blockquote">引用</option>
  </select>
  <select id="size" title="字号" onchange="applyFontSize(this.value)">
    <option value="2">小</option>
    <option value="3" selected>中</option>
    <option value="4">大</option>
    <option value="5">特大</option>
  </select>
  <span class="sep"></span>
  <button onclick="cmd('bold')" title="加粗"><b>B</b></button>
  <button onclick="cmd('italic')" title="斜体"><i>I</i></button>
  <button onclick="cmd('underline')" title="下划线"><u>U</u></button>
  <button onclick="cmd('strikeThrough')" title="删除线"><s>S</s></button>
  <span class="sep"></span>
  <select id="color" title="文字颜色" onchange="cmdValue('foreColor', this.value)">
    <option value="#111418">黑色</option>
    <option value="#C0392B">红色</option>
    <option value="#1565C0">蓝色</option>
    <option value="#2E7D32">绿色</option>
    <option value="#6A1B9A">紫色</option>
    <option value="#E67E22">橙色</option>
  </select>
  <button onclick="cmdValue('hiliteColor','#FFF59D')" title="高亮">🖍</button>
  <span class="sep"></span>
  <button onclick="cmd('justifyLeft')" title="左对齐">⯇</button>
  <button onclick="cmd('justifyCenter')" title="居中">≡</button>
  <button onclick="cmd('justifyRight')" title="右对齐">⯈</button>
  <span class="sep"></span>
  <button onclick="cmd('insertUnorderedList')" title="无序列表">• 列表</button>
  <button onclick="cmd('insertOrderedList')" title="有序列表">1. 列表</button>
  <button onclick="insertTable()" title="插入表格">表格</button>
  <button onclick="insertLink()" title="插入链接">链接</button>
  <button onclick="cmd('formatBlock','p')" title="清除格式">清格式</button>
  <span class="sep"></span>
  <button onclick="insertSlideBreak()" title="插入分节线：演示文稿中每一节将成为一页幻灯片">分节线</button>
  <button onclick="pickMedia('image')" title="插入图片（导出演示文稿时复制到同名 .assets 文件夹）">图片</button>
  <button onclick="pickMedia('video')" title="插入视频（导出演示文稿时复制到同名 .assets 文件夹）">视频</button>
  <button onclick="pickMedia('audio')" title="插入音频（导出演示文稿时复制到同名 .assets 文件夹）">音频</button>
  <button onclick="insertFrame()" title="插入网页 / 交互程序（iframe）">网页</button>
  <span class="sep"></span>
  <button onclick="cmd('undo')" title="撤销">↶</button>
  <button onclick="cmd('redo')" title="重做">↷</button>
  <span class="sep"></span>
  <button class="accent" onclick="askAi('rewrite')" title="AI 改写选中内容">AI 改写</button>
  <button class="accent" onclick="askAi('continue')" title="AI 续写">AI 续写</button>
  <button class="accent" onclick="askAi('polish')" title="AI 润色全文">AI 润色全文</button>
</div>
<div id="wrap"><div id="paper" contenteditable="true"></div></div>
<div id="hint">选中文字后使用 AI 改写，效果更准</div>
<script>
const paper = document.getElementById('paper');
let savedRange = null;

function focusPaper() { paper.focus(); }

function cmd(name) { focusPaper(); document.execCommand(name, false, null); }

function cmdValue(name, value) { focusPaper(); document.execCommand(name, false, value); }

function applyBlock(tag) { focusPaper(); document.execCommand('formatBlock', false, tag); }

function applyFontSize(v) { focusPaper(); document.execCommand('fontSize', false, v); }

function insertTable() {
  focusPaper();
  const rows = parseInt(prompt('行数', '3') || '3', 10);
  const cols = parseInt(prompt('列数', '3') || '3', 10);
  let html = '<table>';
  for (let r = 0; r < rows; r++) {
    html += '<tr>';
    for (let c = 0; c < cols; c++) html += '<td>&nbsp;</td>';
    html += '</tr>';
  }
  html += '</table><p><br></p>';
  document.execCommand('insertHTML', false, html);
}

function insertLink() {
  const url = prompt('链接地址', 'https://');
  if (!url) return;
  focusPaper();
  const sel = window.getSelection();
  if (sel && sel.toString()) document.execCommand('createLink', false, url);
  else document.execCommand('insertHTML', false, `<a href="${url}">${url}</a>`);
}

/* ---------- 演示文稿：分节 / 媒体 / 交互程序 ---------- */
function insertSlideBreak() {
  focusPaper();
  document.execCommand('insertHTML', false, '<hr class="slide-break"><p><br></p>');
}

function pickMedia(kind) {
  const label = { image: '图片', video: '视频', audio: '音频' }[kind] || '文件';
  bridge({ type: 'pick-media', kind });
  flash('请选择' + label + '…');
}

function insertFrame() {
  const url = prompt('网页 / 交互程序地址', 'https://');
  if (!url) return;
  focusPaper();
  document.execCommand('insertHTML', false,
    `<iframe src="${attr(url)}" style="width:100%;height:420px;border:1px solid #99A3AD"></iframe><p><br></p>`);
}

function attr(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function insertMedia(kind, src, name) {
  focusPaper();
  const safeSrc = attr(src || ''), safeName = attr(name || '');
  let html;
  if (kind === 'video') html = `<video controls src="${safeSrc}" style="max-width:100%"></video><p><br></p>`;
  else if (kind === 'audio') html = `<audio controls src="${safeSrc}" style="width:100%"></audio><p><br></p>`;
  else html = `<img src="${safeSrc}" alt="${safeName}" style="max-width:100%"><p><br></p>`;
  document.execCommand('insertHTML', false, html);
}

/* ---------- AI ---------- */
function askAi(mode) {
  const sel = window.getSelection();
  const selected = sel ? sel.toString() : '';
  savedRange = sel && sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
  const text = mode === 'polish' ? paper.innerText : (selected || paper.innerText.slice(-1500));
  if (!text || !text.trim()) { flash('没有可用的文本'); return; }
  bridge({ type: 'ai', mode, text });
  flash('AI 处理中…');
}

function replaceSelection(html) {
  focusPaper();
  if (savedRange) {
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRange);
  }
  document.execCommand('insertHTML', false, html);
  savedRange = null;
}

/* ---------- 与宿主通信 ---------- */
function bridge(payload) {
  if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(payload);
}

function flash(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1B2733;border:1px solid #2A3A49;color:#BFE9F5;padding:8px 14px;border-radius:8px;font-size:12px;z-index:99';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

window.doExport = function (format) {
  bridge({ type: 'export', format, html: paper.innerHTML, text: paper.innerText });
};

window.getEditorHtml = function () { bridge({ type: 'html', html: paper.innerHTML, text: paper.innerText }); };

if (window.chrome && window.chrome.webview) {
  window.chrome.webview.addEventListener('message', ev => {
    const msg = ev.data || {};
    if (msg.type === 'set-html') paper.innerHTML = msg.html || '';
    else if (msg.type === 'ai-result') {
      if (msg.mode === 'polish') paper.innerHTML = msg.html;
      else replaceSelection(msg.html);
      flash('已应用 AI 结果');
    } else if (msg.type === 'ai-error') {
      flash('AI 失败：' + (msg.message || '未知错误'));
    } else if (msg.type === 'insert-media') {
      insertMedia(msg.kind, msg.src, msg.name);
      flash('已插入媒体');
    }
  });
  window.chrome.webview.postMessage({ type: 'ready' });
}
</script>
</body>
</html>
